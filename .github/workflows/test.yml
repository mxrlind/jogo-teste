# Roda os testes do motor em todo PR, antes do merge (o pages.yml só testa depois, no deploy).
name: Testes

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
