<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reino de Bolso</title>
  <meta name="description" content="Idle tycoon 2D: construa seu reino num tabuleiro 12x12 onde a posição de cada prédio importa.">
  <meta name="theme-color" content="#2b2a33">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/app/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icons/app/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/icons/app/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="assets/fonts/nunito-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="screen-loading">
  <!-- Tela de carregamento -->
  <section id="loading" class="screen" aria-live="polite">
    <img class="logo-sprite" src="assets/sprites/kaykit/logo-castelo.png" alt="">
    <h1>Reino de Bolso</h1>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100"><i id="loadBar"></i></div>
    <p id="loadText">Carregando...</p>
  </section>

  <!-- Menu principal -->
  <section id="mainMenu" class="screen" hidden>
    <canvas id="menuMap" aria-hidden="true"></canvas>
    <div class="menu-card panel">
      <img class="logo-sprite" src="assets/sprites/kaykit/logo-castelo.png" alt="">
      <h1>Reino de Bolso</h1>
      <p class="tagline">Um reino de bolso onde a posição de cada prédio importa.</p>
      <div id="menuButtons" class="stack"></div>
      <p class="version" id="menuVersion"></p>
    </div>
  </section>

  <!-- Jogo -->
  <section id="game" class="screen" hidden>
    <header id="hud">
      <button id="menuBtn" class="btn small grey icon-only" data-action="gameMenu" aria-label="Menu do jogo"></button>
      <div id="brand"></div>
      <div id="hud-res"></div>
      <div id="hud-status"></div>
    </header>
    <main id="layout">
      <aside id="palette" aria-label="Construções"></aside>
      <section id="stage">
        <div id="tutorial" hidden></div>
        <div id="visitBar" hidden></div>
        <div id="modeHint" hidden></div>
        <div id="mapWrap"><canvas id="map" tabindex="0" aria-label="Mapa do reino. Use as setas para mover o cursor e Enter para agir."></canvas></div>
        <div id="tileInfo" class="panel" hidden></div>
      </section>
      <aside id="side" class="panel">
        <nav id="tabs" role="tablist"></nav>
        <div id="side-body"></div>
      </aside>
    </main>
  </section>

  <div id="toasts" aria-live="polite"></div>
  <div id="modal" role="dialog" aria-modal="true" hidden></div>
  <noscript>O Reino de Bolso precisa de JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
